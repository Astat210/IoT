<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель мониторинга IoT (Температура)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        #status { margin-bottom: 20px; font-weight: bold; }
        #chartContainer { position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Мониторинг температуры (HiveMQ)</h1>
        <p id="status">Статус: Отключение</p>
        <div id="chartContainer">
            <canvas id="tempChart"></canvas>
        </div>
        <p>Последнее значение: <span id="latestTemp" style="font-size: 1.5em; color: #007bff;">--</span> °C</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
